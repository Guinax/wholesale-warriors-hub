name: Generate Mansao Maromba PWA icons
on:
  push:
    paths:
      - ".github/workflows/mansao-brand-icons.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Prepare original brand icons
        env:
          BRAND_URL: https://d3t3ozftmdmh3i.cloudfront.net/production/podcast_uploaded_nologo/14492488/14492488-1618463986716-52d9103563f9e.jpg
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from io import BytesIO
          from urllib.request import Request, urlopen
          import os
          req = Request(os.environ["BRAND_URL"], headers={"User-Agent":"Mozilla/5.0"})
          raw = urlopen(req, timeout=25).read()
          im = Image.open(BytesIO(raw)).convert("RGB")
          # Preserve the selected artwork while cropping any surrounding white framing.
          pix = im.load()
          w,h = im.size
          pts = [(x,y) for y in range(0,h,max(1,h//300)) for x in range(0,w,max(1,w//300)) if max(pix[x,y]) < 90]
          if not pts: raise RuntimeError("Logo source missing dark artwork")
          x0=min(x for x,y in pts);x1=max(x for x,y in pts)
          y0=min(y for x,y in pts);y1=max(y for x,y in pts)
          im=im.crop((x0,y0,x1+1,y1+1))
          def export(path,size,scale):
              canvas=Image.new("RGB",(size,size),"black")
              inner=int(size*scale)
              logo=ImageOps.contain(im,(inner,inner),Image.Resampling.LANCZOS)
              canvas.paste(logo,((size-logo.width)//2,(size-logo.height)//2))
              canvas.save(path,"PNG",optimize=True)
          for name,size,scale in [
              ("public/icon-192-maromba-v2.png",192,.92),
              ("public/icon-512-maromba-v2.png",512,.92),
              ("public/icon-maskable-maromba-v2.png",512,.72),
              ("public/apple-touch-icon-maromba-v2.png",180,.83),
              ("public/favicon-maromba-v2.png",64,.94),
              ("src/assets/logo.png",512,.94),
          ]:
              os.makedirs(os.path.dirname(name),exist_ok=True)
              export(name,size,scale)
          PY
      - name: Publish brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*maromba-v2.png src/assets/logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Brand: update Android PWA icons from Mansao Maromba emblem"
            git push origin HEAD:Main
          fi
